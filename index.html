  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 0;
    }

    .container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      background: white;
      min-height: 100vh;
      overflow: hidden;
      box-shadow: none;
      border-radius: 0;
    }

    /* タブレット */
    @media screen and (min-width: 600px) {
      body {
        padding: 20px 0;
      }
      .container {
        max-width: 540px;
        min-height: auto;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }
    }

    /* PC */
    @media screen and (min-width: 1024px) {
      .container {
        max-width: 480px;
      }
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 25px 20px;
      text-align: center;
      position: relative;
    }

    .header.end-mode {
      background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .menu-button {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.3s ease;
    }

    .menu-button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .menu-button span {
      width: 20px;
      height: 2px;
      background: white;
      display: block;
      border-radius: 2px;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100vh;
      background: white;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      transition: left 0.3s ease;
      z-index: 1000;
    }

    .side-menu.active {
      left: 0;
    }

    .side-menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 999;
    }

    .side-menu-overlay.active {
      display: block;
    }

    .side-menu-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      font-size: 18px;
      font-weight: 600;
    }

    .side-menu-items {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .side-menu-item {
      border-bottom: 1px solid #f0f0f0;
    }

    .side-menu-item button {
      width: 100%;
      padding: 18px 20px;
      background: none;
      border: none;
      text-align: left;
      font-size: 16px;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.2s;
    }

    .side-menu-item button:hover {
      background: #f8f9fa;
    }

    .side-menu-item button:active {
      background: #e9ecef;
    }

    .history-link {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .history-link:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .tabs {
      display: flex;
      background: #f5f5f7;
      padding: 10px;
      gap: 10px;
    }

    .tab {
      flex: 1;
      padding: 16px;
      background: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #666;
    }

    .tab.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .tab.active.end-tab {
      background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
    }

    .form-container {
      padding: 20px 16px 30px;
    }

    @media screen and (min-width: 600px) {
      .form-container {
        padding: 25px 24px 30px;
      }
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-size: 15px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      padding: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s ease;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
      background-color: white;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 20px;
      padding-right: 44px;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    textarea {
      background-image: none;
      padding-right: 16px;
    }

    select:focus,
    input:focus,
    textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .button-group {
      display: flex;
      justify-content: flex-end;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .add-button {
      padding: 10px 18px;
      background: #34c759;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .add-button:active {
      transform: scale(0.98);
      background: #2fb34d;
    }

    .submit-button {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 25px;
      box-shadow: 0 6px 20px rgba(238, 90, 111, 0.3);
      transition: all 0.3s ease;
    }

    .submit-button:active {
      transform: scale(0.98);
      box-shadow: 0 3px 10px rgba(238, 90, 111, 0.3);
    }

    .clear-button {
      width: 100%;
      padding: 16px;
      background: #f5f5f7;
      color: #666;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.3s ease;
    }

    .clear-button:active {
      background: #e8e8ea;
    }

    .message {
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    .message.success {
      background: #d1f4e0;
      color: #0f5132;
      border: 1px solid #b8e6cc;
    }

    .message.error {
      background: #ffe5e5;
      color: #842029;
      border: 1px solid #ffcccc;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #667eea;
      font-weight: 600;
    }

    .divider {
      height: 1px;
      background: #e0e0e0;
      margin: 25px 0;
    }

    .toll-section-item {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      position: relative;
    }

    .toll-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .toll-section-title {
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    .remove-toll-button {
      background: #ff3b30;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    .remove-toll-button:active {
      background: #d32f2f;
    }

    .toll-section-item .form-group {
      margin-bottom: 12px;
    }

    .toll-section-item .form-group:last-child {
      margin-bottom: 0;
    }

    .toll-section-item label {
      font-size: 14px;
    }

    .history-view {
      display: none;
      padding: 20px 16px;
    }

    .history-view.active {
      display: block;
    }

    @media screen and (min-width: 600px) {
      .history-view {
        padding: 25px 24px;
      }
    }

    .history-filters {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .history-filters .form-group {
      margin-bottom: 15px;
    }

    .history-filters .form-group:last-child {
      margin-bottom: 0;
    }

    .search-button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .search-button:active {
      transform: scale(0.98);
    }

    .back-button {
      width: 100%;
      padding: 16px;
      background: #f5f5f7;
      color: #666;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .back-button:active {
      background: #e8e8ea;
    }

    .history-results {
      margin-top: 20px;
    }

    .history-item {
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .copy-button {
      display: block;
      margin: 12px auto 0;
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: fit-content;
    }

    .copy-button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
    }

    .copy-button:active {
      transform: translateY(0);
    }

    .combined-table {
      width: 100%;
      border-collapse: collapse;
    }

    .combined-table tr {
      border-bottom: 1px solid #f0f0f0;
    }

    .combined-table tr:last-child {
      border-bottom: none;
    }

    .combined-table td {
      padding: 12px 8px;
      font-size: 14px;
    }

    .combined-table td.label {
      background: #f8f9fa;
      font-weight: 600;
      color: #666;
    }

    .combined-table td.value {
      color: #333;
    }

    .combined-table td.spacer {
      padding: 5px;
      background: transparent;
      border: none;
    }

    .combined-table td.toll-start,
    .combined-table td.toll-end,
    .combined-table td.toll-fee {
      background: #fff8e1;
      color: #333;
      text-align: center;
      font-size: 13px;
    }

    .history-timestamp {
      font-size: 12px;
      color: #999;
      text-align: right;
      padding-top: 8px;
      margin-top: 8px;
      border-top: 1px solid #f0f0f0;
    }

    .history-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    .history-item-title {
      font-weight: 600;
      color: #333;
      font-size: 15px;
    }

    .edit-button {
      padding: 10px 18px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .edit-button:active {
      transform: scale(0.98);
    }

    .history-item-content {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }

    .history-item-content div {
      margin-bottom: 6px;
    }

    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: #999;
      font-size: 15px;
    }

    .edit-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }

    .edit-modal.active {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 40px;
    }

    .edit-modal-content {
      background: white;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      margin-bottom: 40px;
    }

    .edit-modal-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 20px 20px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .edit-modal-header h2 {
      font-size: 18px;
      font-weight: 600;
    }

    .close-modal {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .edit-modal-body {
      padding: 25px 20px;
    }

    .management-view {
      display: none;
      padding: 20px 16px;
    }

    .management-view.active {
      display: block;
    }

    @media screen and (min-width: 600px) {
      .management-view {
        padding: 25px 24px;
      }
    }

    .management-section {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .management-section h3 {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
    }

    .management-list {
      max-height: 300px;
      overflow-y: auto;
      background: white;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 15px;
    }

    .management-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
    }

    .delete-button {
      padding: 8px 14px;
      background: #ff3b30;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 上書き確認モーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      padding: 20px;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .modal-title {
      color: #ff9800;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 15px 0;
      text-align: center;
    }

    .modal-message {
      color: #666;
      font-size: 15px;

    .modal-button-primary {
      background: #667eea;
      color: white;
    }

    .modal-button-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .modal-button-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .modal-button-secondary:hover {
      background: #e0e0e0;

    .modal-button-cancel {

    .modal-button-cancel:hover {

    .password-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;

      justify-content: center;
      padding: 20px;

      border-radius: 12px;

      align-items: center;
    }

    }

    .time-select-wrapper .time-separator {

<body>
  <div class="container">
    <div class="header" id="app-header">
      <button class="menu-button" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <h1>🚛 新宮DC</h1>
      <p>号車情報送信システム</p>
    </div>

    <div class="tabs" id="main-tabs">
      <button class="tab active" onclick="switchTab('start')">開始</button>
      <button class="tab end-tab" onclick="switchTab('end')">終了</button>
    </div>

    <div class="form-container">
      <div id="message" class="message"></div>
      <div id="loading" class="loading">送信中...</div>

      <!-- 開始タブのフォーム -->
      <div id="start-content" class="tab-content active">
        <form id="start-form">

    // 履歴検索
    function searchHistory() {
      const date = document.getElementById('history-date').value;
      const car = document.getElementById('history-car').value;

      if (!date || !car) {
        alert('日付と号車を両方選択してください');
        return;
      }

      showLoading();
      google.script.run
        .withSuccessHandler(function(results) {
          hideLoading();
          displayHistoryResults(results);
        })
        .withFailureHandler(function(error) {
          hideLoading();
          alert('検索エラー: ' + error.message);
        })
        .searchHistoryByDateAndCar(date, car);
    }

    // テーブルをクリップボードにコピー
    function copyTableToClipboard(button) {
      const historyItem = button.parentElement;
      const table = historyItem.querySelector('.combined-table');

      if (!table) {
        alert('テーブルが見つかりません');
        return;
      }

      // テーブルのデータをタブ区切りのテキストに変換
      let text = '';
      const rows = table.querySelectorAll('tr');

      rows.forEach(function(row) {
        const cells = row.querySelectorAll('td');
        const rowData = [];

        // 空行（spacer）かどうかをチェック
        const isSpacerRow = cells.length > 0 && cells[0].classList.contains('spacer');

        if (isSpacerRow) {
          // 空行の場合は3つの空セルを追加
          text += '\t\t\n';
        } else {
          cells.forEach(function(cell) {
            // colspanがある場合は、その数だけセルを追加
            const colspan = cell.getAttribute('colspan') || 1;
            const cellText = cell.textContent.trim();

            if (colspan == 2) {
              // ラベルセル（2列分）
              rowData.push(cellText);
              rowData.push(''); // 2列目は空
            } else if (colspan == 3) {
              // 3列分のセル（有料道路のヘッダーなど）
              rowData.push(cellText);
              rowData.push('');
              rowData.push('');
            } else {
              rowData.push(cellText);
            }
          });

          text += rowData.join('\t') + '\n';
        }
      });

      // クリップボードにコピー
      navigator.clipboard.writeText(text).then(function() {
        // ボタンのテキストを一時的に変更
        const originalText = button.textContent;
        button.textContent = '✓ コピーしました！';
        button.style.backgroundColor = '#4caf50';

        setTimeout(function() {
          button.textContent = originalText;
          button.style.backgroundColor = '';
        }, 2000);
      }).catch(function(err) {
        alert('コピーに失敗しました: ' + err);
      });
    }

    // 時間を HH:MM 形式にフォーマット
    function formatTime(timeValue) {
      if (!timeValue) return '';

      // すでに HH:MM 形式の場合
      if (typeof timeValue === 'string' && timeValue.match(/^\d{1,2}:\d{2}$/)) {
        const parts = timeValue.split(':');
        return String(parts[0]).padStart(2, '0') + ':' + parts[1];
      }

      // Date オブジェクトの場合
      if (timeValue instanceof Date || typeof timeValue === 'object') {
        const d = new Date(timeValue);
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      }

      // 文字列の場合（様々な形式に対応）
      const str = String(timeValue);

      // "HH:MM:SS" 形式
      if (str.match(/^\d{1,2}:\d{2}:\d{2}$/)) {
        const parts = str.split(':');
        return String(parts[0]).padStart(2, '0') + ':' + parts[1];
      }

      // "HHMM" 形式
      if (str.match(/^\d{3,4}$/)) {
        const hours = str.length === 3 ? str.substring(0, 1) : str.substring(0, 2);
        const minutes = str.length === 3 ? str.substring(1, 3) : str.substring(2, 4);
        return String(hours).padStart(2, '0') + ':' + minutes;
      }

      return timeValue;
    }

    // 履歴結果表示
    function displayHistoryResults(results) {
      const container = document.getElementById('history-results');

      if (!results || results.length === 0) {
        container.innerHTML = '<div class="no-results">該当する履歴が見つかりませんでした</div>';
        return;
      }

      let html = '';
      results.forEach(function(item) {
        const start = item.startData;
        const end = item.endData;

        // 業務終了時間と帰庫時間を計算
        let businessEndTime = '';
        let returnTime = '';

        if (end) {
          const submitTiming = end.submitTiming || '営業所帰庫時';
          const travelTime = parseInt(end.travelTime) || 30;

          if (submitTiming === '営業所帰庫時') {
            // 営業所帰庫時の場合：帰庫時間 - 移動時間 = 業務終了時間
            if (end.officeReturn) {
              returnTime = end.officeReturn;
              const time = returnTime.split(':');
              if (time.length === 2) {
                let hour = parseInt(time[0]);
                let minute = parseInt(time[1]) - travelTime;
                while (minute < 0) {
                  hour -= 1;
                  minute += 60;
                }
                if (hour < 0) hour = 0;
                businessEndTime = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
              }
            }
          } else {
            // 積み込み終了時の場合：業務終了時間 + 移動時間 = 帰庫時間
            if (end.businessEndTime) {
              businessEndTime = end.businessEndTime;
              const time = businessEndTime.split(':');
              if (time.length === 2) {
                let hour = parseInt(time[0]);
                let minute = parseInt(time[1]) + travelTime;
                while (minute >= 60) {
                  hour += 1;
                  minute -= 60;
                }
                returnTime = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
              }
            }
          }
        }

        html += '<div class="history-item">';
        html += '<table class="combined-table">';
        html += '<tr><td class="label" colspan="2">車両No</td><td class="value">' + (start ? start.vehicleNo : '') + '</td></tr>';
        html += '<tr><td class="label" colspan="2">号車</td><td class="value">' + item.carNumber + '</td></tr>';
        html += '<tr><td class="label" colspan="2">庸車区分①</td><td class="value">' + (start ? start.hiredVehicle1 : '') + '</td></tr>';
        html += '<tr><td class="label" colspan="2">庸車区分②</td><td class="value">' + (start ? start.hiredVehicle2 : '') + '</td></tr>';
        html += '<tr><td class="label" colspan="2">運転者</td><td class="value">' + (start ? start.driverName : '') + '</td></tr>';
        html += '<tr><td class="label" colspan="2">助手</td><td class="value">' + (start ? start.assistant : '') + '</td></tr>';
        html += '<tr><td class="spacer" colspan="3"></td></tr>';
        html += '<tr><td class="label" colspan="2">出庫メーター</td><td class="value">' + (start ? start.exitMileage : '') + '</td></tr>';
        html += '<tr><td class="label" colspan="2">帰庫メーター</td><td class="value">' + (end ? end.returnMileage : '') + '</td></tr>';
        html += '<tr><td class="spacer" colspan="3"></td></tr>';
        html += '<tr><td class="label" colspan="2">出発時間</td><td class="value">' + (start ? formatTime(start.exitTime) : '') + '</td></tr>';
        html += '<tr><td class="label" colspan="2">帰着時間</td><td class="value">' + (end ? formatTime(end.centerArrival) : '') + '</td></tr>';
        html += '<tr><td class="label" colspan="2">業務終了</td><td class="value">' + businessEndTime + '</td></tr>';
        html += '<tr><td class="label" colspan="2">帰庫時間</td><td class="value">' + returnTime + '</td></tr>';
        html += '<tr><td class="spacer" colspan="3"></td></tr>';
        html += '<tr><td class="label" colspan="2">有料道路</td><td class="label">料金</td></tr>';

        // 有料道路の区間を表示
        if (end && end.tollSections && end.tollSections.length > 0) {
          end.tollSections.forEach(function(section) {
            html += '<tr>';
            html += '<td class="toll-start">' + section.start + '</td>';
            html += '<td class="toll-end">' + section.end + '</td>';
            html += '<td class="toll-fee">' + section.fee + '</td>';
            html += '</tr>';
          });
        } else {
          // 有料道路がない場合も空行を追加してテーブル構造を保持
          html += '<tr>';
          html += '<td class="toll-start"></td>';
          html += '<td class="toll-end"></td>';
          html += '<td class="toll-fee"></td>';
          html += '</tr>';
        }

        html += '</table>';

        // 登録日時
        const timestamp = start ? start.timestamp : (end ? end.timestamp : '');
        if (timestamp) {
          html += '<div class="history-timestamp">登録日時: ' + new Date(timestamp).toLocaleString('ja-JP') + '</div>';
        }

        html += '<button class="copy-button" onclick="copyTableToClipboard(this)">📋 コピー</button>';
        html += '</div>';
      });

      container.innerHTML = html;
    }

    function populateTimeSelects() {

      for (let h = 5; h <= 23; h++) {
        hours.push(String(h).padStart(2, '0'));
      }

      for (let m = 0; m < 60; m += 5) {

      // 時間のselectを取得
      const hourSelects = [

        document.getElementById('end-center-arrival-hour'),
        document.getElementById('end-office-return-hour')
      ];

        document.getElementById('start-exit-time-minute'),
        document.getElementById('end-center-arrival-minute'),
        document.getElementById('end-office-return-minute')
      ];

      // 時間の選択肢を追加
      hourSelects.forEach(select => {
        hours.forEach(hour => {
          const option = document.createElement('option');
          option.value = hour;
          option.textContent = hour;
          select.appendChild(option);
        });

      // 分の選択肢を追加

          option.value = minute;
          option.textContent = minute;

        });

          document.getElementById('end-form').reset();
        }
        overwriteMode = false;
      } else if (action === 'overwrite') {
        // 上書き保存モードを有効化
        overwriteMode = true;
      }

      pendingFormType = null;
    }

    // 今日の日付を自動設定（削除）
    // document.getElementById('start-date').valueAsDate = new Date();
    // document.getElementById('end-date').valueAsDate = new Date();

    // ドライバー名の新規登録
    document.getElementById('add-driver-btn').addEventListener('click', function() {
      const carNumber = document.getElementById('start-car').value;

      if (!carNumber) {
        alert('先に号車を選択してください');
        return;
      }

      const driverName = prompt('ドライバー名を入力してください');

      if (driverName && driverName.trim() !== '') {
        // スプレッドシートに保存
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.success) {
              alert('ドライバー名を登録しました');
              // ドロップダウンを更新
              loadDriverOptions(carNumber, driverName.trim());
            } else {
              alert('登録エラー: ' + response.message);
            }
          })
          .withFailureHandler(function(error) {
            alert('登録エラーが発生しました: ' + error.message);
          })
          .saveDriverName(carNumber, driverName.trim());
      }
    });

    // 車両Noの新規登録
    document.getElementById('add-vehicle-btn').addEventListener('click', function() {
      const carNumber = document.getElementById('start-car').value;

      if (!carNumber) {
        alert('先に号車を選択してください');
        return;
      }

      let vehicleNo = prompt('車両Noを入力してください（半角数字4桁まで）');

      if (vehicleNo !== null) {
        // 全角数字を半角に変換
        vehicleNo = vehicleNo.replace(/[０-９]/g, function(s) {
          return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
        });

        // 半角数字のみ、4桁まで
        if (!/^[0-9]{1,4}$/.test(vehicleNo)) {
          alert('半角数字4桁までで入力してください');
          return;
        }

        // スプレッドシートに保存
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.success) {
              alert('車両Noを登録しました');
              // ドロップダウンを更新
              loadVehicleOptions(carNumber, vehicleNo);
            } else {
              alert('登録エラー: ' + response.message);
            }
          })
          .withFailureHandler(function(error) {
            alert('登録エラーが発生しました: ' + error.message);
          })
          .saveVehicleNo(carNumber, vehicleNo);
      }
    });

    // 号車選択時にドライバー名と車両Noの選択肢を読み込む
    document.getElementById('start-car').addEventListener('change', function() {
      const carNumber = this.value;

      if (carNumber) {
        loadDriverOptions(carNumber);
        loadVehicleOptions(carNumber);
      } else {
        // 号車が未選択の場合はリセット
        resetDriverOptions();
        resetVehicleOptions();
      }
    });

    // ドライバー名の選択肢を読み込む
    function loadDriverOptions(carNumber, selectValue) {
      google.script.run
        .withSuccessHandler(function(drivers) {
          const select = document.getElementById('start-driver');
          select.innerHTML = '<option value="">選択してください</option>';

          drivers.forEach(function(driver) {
            const option = document.createElement('option');
            option.value = driver;
            option.textContent = driver;
            select.appendChild(option);
          });

          // 新規登録直後の場合は自動選択
          if (selectValue) {
            select.value = selectValue;
          }
        })
        .withFailureHandler(function(error) {
          console.error('ドライバー名取得エラー:', error);
        })
        .getDriverNames(carNumber);
    }

    // 車両Noの選択肢を読み込む
    function loadVehicleOptions(carNumber, selectValue) {
      google.script.run
        .withSuccessHandler(function(vehicles) {
          const select = document.getElementById('start-vehicle');
          select.innerHTML = '<option value="">選択してください</option>';

          vehicles.forEach(function(vehicle) {
            const option = document.createElement('option');
            option.value = vehicle;
            option.textContent = vehicle;
            select.appendChild(option);
          });

          // 新規登録直後の場合は自動選択
          if (selectValue) {
            select.value = selectValue;
          }
        })
        .withFailureHandler(function(error) {
          console.error('車両No取得エラー:', error);
        })
        .getVehicleNumbers(carNumber);
    }

    // ドライバー名選択肢をリセット
    function resetDriverOptions() {
      const select = document.getElementById('start-driver');
      select.innerHTML = '<option value="">選択してください</option>';
    }

    // 車両No選択肢をリセット
    function resetVehicleOptions() {
      const select = document.getElementById('start-vehicle');
      select.innerHTML = '<option value="">選択してください</option>';
    }

    // 終了タブの日付と号車が変更されたときのバリデーション
    function validateEndFormStartData() {
      const endDate = document.getElementById('end-date').value;
      const endCar = document.getElementById('end-car').value;

      if (endDate && endCar) {
        google.script.run
          .withSuccessHandler(function(exists) {
            if (!exists) {
              alert('警告: この日付と号車の開始情報が登録されていません。先に開始情報を入力してください。');
            }
          })
          .withFailureHandler(function(error) {
            console.error('開始情報の確認エラー:', error);
          })
          .checkStartDataExists(endDate, endCar);
      }
    }

    document.getElementById('end-date').addEventListener('change', validateEndFormStartData);
    document.getElementById('end-car').addEventListener('change', validateEndFormStartData);

    // 有料道路セクションのカウンター
    let tollSectionCount = 0;
    const MAX_TOLL_SECTIONS = 10;

    // 業務終了後の行き先による表示制御
    document.getElementById('end-destination').addEventListener('change', function() {
      const centerArrivalGroup = document.getElementById('center-arrival-group');
      const centerArrivalHour = document.getElementById('end-center-arrival-hour');
      const centerArrivalMinute = document.getElementById('end-center-arrival-minute');

      if (this.value === '直帰') {
        centerArrivalGroup.style.display = 'none';
        centerArrivalHour.removeAttribute('required');
        centerArrivalMinute.removeAttribute('required');
      } else {
        centerArrivalGroup.style.display = 'block';
        centerArrivalHour.setAttribute('required', 'required');
        centerArrivalMinute.setAttribute('required', 'required');
      }
    });

    // 有料道路使用による表示制御
    document.getElementById('end-toll-road').addEventListener('change', function() {
      const tollSections = document.getElementById('toll-sections');

      if (this.value === 'はい') {
        tollSections.style.display = 'block';
        // 初回は1つ自動追加
        if (tollSectionCount === 0) {
          addTollSection();
        }
      } else {
        tollSections.style.display = 'none';
        // セクションをクリア
        document.getElementById('toll-section-list').innerHTML = '';
        tollSectionCount = 0;
      }
    });

    // 有料道路区間追加
    document.getElementById('add-toll-section').addEventListener('click', function() {
      if (tollSectionCount < MAX_TOLL_SECTIONS) {
        addTollSection();
      } else {
        alert('使用区間は最大10件までです');
      }
    });

    function addTollSection() {
      tollSectionCount++;
      const sectionList = document.getElementById('toll-section-list');
      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'toll-section-item';
      sectionDiv.id = 'toll-section-' + tollSectionCount;

      sectionDiv.innerHTML = `
        <div class="toll-section-header">
          <span class="toll-section-title">使用区間 ${tollSectionCount}</span>
          <button type="button" class="remove-toll-button" onclick="removeTollSection(${tollSectionCount})">削除</button>
        </div>
        <div class="form-group">
          <label>開始区間</label>
          <input type="text" name="toll-start-${tollSectionCount}" required>
        </div>
        <div class="form-group">
          <label>終了区間</label>
          <input type="text" name="toll-end-${tollSectionCount}" required>
        </div>
        <div class="form-group">
          <label>料金</label>
          <input type="text" name="toll-fee-${tollSectionCount}" required pattern="[0-9]+" title="半角数字のみ入力してください" inputmode="numeric">
        </div>
      `;

      sectionList.appendChild(sectionDiv);

      // ボタンの表示制御
      if (tollSectionCount >= MAX_TOLL_SECTIONS) {
        document.getElementById('add-toll-section').style.display = 'none';
      }
    }

    function removeTollSection(id) {
      const section = document.getElementById('toll-section-' + id);
      if (section) {
        section.remove();
        tollSectionCount--;

        // ボタンを再表示
        if (tollSectionCount < MAX_TOLL_SECTIONS) {
          document.getElementById('add-toll-section').style.display = 'block';
        }

        // 番号を振り直し
        renumberTollSections();
      }
    }

    function renumberTollSections() {
      const sections = document.querySelectorAll('.toll-section-item');
      sections.forEach((section, index) => {
        const title = section.querySelector('.toll-section-title');
        if (title) {
          title.textContent = '使用区間 ' + (index + 1);
        }
      });
    }

    // タブ切り替え
    function switchTab(tab) {
      // メッセージをクリア
      hideMessage();

      // タブボタンの切り替え
      const tabs = document.querySelectorAll('.tab');
      tabs.forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');

      // ヘッダーの色を変更
      const header = document.getElementById('app-header');
      if (tab === 'end') {
        header.classList.add('end-mode');
      } else {
        header.classList.remove('end-mode');
      }

      // コンテンツの切り替え
      document.getElementById('start-content').classList.remove('active');
      document.getElementById('end-content').classList.remove('active');
      document.getElementById(tab + '-content').classList.add('active');
    }

    // 履歴表示
    function showHistory() {
      document.getElementById('main-tabs').style.display = 'none';
      document.getElementById('start-content').style.display = 'none';
      document.getElementById('end-content').style.display = 'none';
      document.getElementById('history-view').classList.add('active');

      // 自動的に最近の履歴を表示
      loadRecentHistory();
    }

    // 最近の履歴を自動ロード
    function loadRecentHistory() {
      console.log('loadRecentHistory called');
      showLoading();
      google.script.run
        .withSuccessHandler(function(results) {
          console.log('Success handler called, results:', results);
          hideLoading();
          displayHistoryResults(results);
        })
        .withFailureHandler(function(error) {
          console.error('Failure handler called, error:', error);
          hideLoading();
          alert('履歴取得エラー: ' + error.message);
        })
        .searchHistory('', '', '');
    }

    // 履歴非表示
    // 開始フォームの送信
    document.getElementById('start-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const exitTimeHour = document.getElementById('start-exit-time-hour').value;
      const exitTimeMinute = document.getElementById('start-exit-time-minute').value;
      const exitTime = exitTimeHour + ':' + exitTimeMinute;

      const formData = {
        date: document.getElementById('start-date').value,
        carNumber: document.getElementById('start-car').value,
        driverName: document.getElementById('start-driver').value,
        vehicleNo: document.getElementById('start-vehicle').value,
        hiredVehicle1: document.getElementById('start-hired-vehicle1').value,
        hiredVehicle2: document.getElementById('start-hired-vehicle2').value,
        assistant: document.getElementById('start-assistant').value,
        exitMileage: document.getElementById('start-exit-mileage').value,
        exitTime: exitTime
      };

      submitData('saveStartData', formData, 'start');
    });

    // 終了フォームの送信
    document.getElementById('end-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const destination = document.getElementById('end-destination').value;
      const officeReturnHour = document.getElementById('end-office-return-hour').value;
      const officeReturnMinute = document.getElementById('end-office-return-minute').value;
      const timeValue = officeReturnHour + ':' + officeReturnMinute;

      let centerArrival;
      if (destination === '直帰') {
        centerArrival = timeValue;
      } else {
        const centerArrivalHour = document.getElementById('end-center-arrival-hour').value;
        const centerArrivalMinute = document.getElementById('end-center-arrival-minute').value;
        centerArrival = centerArrivalHour + ':' + centerArrivalMinute;
      }

      // 有料道路情報の収集
      const tollRoad = document.getElementById('end-toll-road').value;
      let tollSections = [];

      if (tollRoad === 'はい') {
        const sections = document.querySelectorAll('.toll-section-item');
        sections.forEach((section, index) => {
          const num = index + 1;
          tollSections.push({
            start: section.querySelector(`[name="toll-start-${section.id.split('-')[2]}"]`).value,
            end: section.querySelector(`[name="toll-end-${section.id.split('-')[2]}"]`).value,
            fee: section.querySelector(`[name="toll-fee-${section.id.split('-')[2]}"]`).value
          });
        });
      }

      // 送信タイミングに応じてデータを設定
      const formData = {
        date: document.getElementById('end-date').value,
        carNumber: document.getElementById('end-car').value,
        destination: destination,
        returnMileage: document.getElementById('end-return-mileage').value,
        centerArrival: centerArrival,
        cashDelivery: document.getElementById('end-cash-delivery').value,
        tollRoad: tollRoad,
        tollSections: tollSections,
        submitTiming: currentEndTimingSettings.submitTiming,
        travelTime: currentEndTimingSettings.travelTime
      };

      // 送信タイミングに応じて時間データを振り分け
      if (currentEndTimingSettings.submitTiming === '積み込み終了時') {
        formData.businessEndTime = timeValue;  // 業務終了時間として保存
        formData.officeReturn = '';  // 帰庫時間は空
      } else {
        formData.officeReturn = timeValue;  // 帰庫時間として保存
        formData.businessEndTime = '';  // 業務終了時間は空
      }

      submitData('saveEndData', formData, 'end');
    });

    // データ送信
    function submitData(functionName, data, formType) {
      showLoading();
      hideMessage();

      google.script.run
        .withSuccessHandler(function(response) {
          hideLoading();
          if (response.success) {
            showMessage(response.message, 'success');
            clearForm(formType);
            overwriteMode = false; // リセット
          } else {
            showMessage(response.message, 'error');
          }
        })
        .withFailureHandler(function(error) {
          hideLoading();
          showMessage('送信エラーが発生しました: ' + error.message, 'error');
        })
        [functionName](data, overwriteMode);
    }

    // フォームクリア
    function clearForm(type) {
      document.getElementById(type + '-form').reset();
      if (type === 'end') {
        // 有料道路セクションをクリア
        document.getElementById('toll-section-list').innerHTML = '';
        tollSectionCount = 0;
        document.getElementById('toll-sections').style.display = 'none';
        document.getElementById('center-arrival-group').style.display = 'block';
        document.getElementById('end-center-arrival-hour').setAttribute('required', 'required');
        document.getElementById('end-center-arrival-minute').setAttribute('required', 'required');
      }
      hideMessage();
    }

    // メッセージ表示
    function showMessage(text, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
      messageEl.style.display = 'block';

      // 3秒後に自動で消す
      setTimeout(() => {
        hideMessage();
      }, 3000);
    }

    function hideMessage() {
      document.getElementById('message').style.display = 'none';
    }

    // ローディング表示
    function showLoading() {
      document.getElementById('loading').style.display = 'block';
    }

    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
    }

    // iOSのズーム防止
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });
  </script>
</body>
</html>
